# CI/CD 配置文件
# 立体声转5.1&7.1声道混音工具 v3.1.0

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
env:
  PYTHON_VERSION: "3.12"

jobs:
  # ==================== 代码检查 ====================
  lint:
    name: 代码检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装检查工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: 运行 flake8 检查
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 检查代码格式 (Black)
        run: black --check --diff .

      - name: 检查导入排序 (isort)
        run: isort --check-only --diff .

  # ==================== 单元测试 ====================
  test:
    name: 单元测试
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装基础依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flask pydub numpy soundfile

      - name: 安装 FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: 运行基础导入测试
        run: |
          python -c "import flask; print('Flask OK')"
          python -c "import pydub; print('PyDub OK')"
          python -c "import numpy; print('NumPy OK')"

      - name: 运行单元测试
        run: |
          pytest tests/ -v --tb=short

      - name: 语法检查
        run: |
          python -m py_compile main.py
          python -m py_compile web_mixer.py

  # ==================== 安全检查 ====================
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装安全检查工具
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: 运行 Bandit 安全检查
        run: bandit -r . -x ./Python,./tests,./.github --skip B101 || true
        continue-on-error: true

      - name: 检查依赖漏洞
        run: |
          # 跳过 Windows 特定依赖的检查 (triton, CUDA 相关)
          # requirements.txt 包含平台特定的轮子文件
          echo "Skipping full requirements.txt check (contains Windows-specific wheels)"
          echo "Checking core dependencies only..."
          pip install safety || true
          echo -e "flask\npydub\nnumpy\nsoundfile\nlibrosa\ntqdm" > requirements-core.txt
          safety check -r requirements-core.txt || true
        continue-on-error: true

  # ==================== 构建测试 ====================
  build:
    name: 构建验证
    runs-on: windows-latest
    needs: [test]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flask pydub numpy soundfile

      - name: 验证项目结构
        run: |
          # 检查必要文件
          if (!(Test-Path "main.py")) { throw "main.py not found" }
          if (!(Test-Path "web_mixer.py")) { throw "web_mixer.py not found" }
          if (!(Test-Path "requirements.txt")) { throw "requirements.txt not found" }
          if (!(Test-Path "web_templates/setup.html")) { throw "setup.html not found" }
          if (!(Test-Path "web_templates/mixer.html")) { throw "mixer.html not found" }
          if (!(Test-Path "bsroformer/inference.py")) { throw "inference.py not found" }
          if (!(Test-Path "model.txt")) { throw "model.txt not found" }
          Write-Host "All required files present!"
        shell: pwsh

      - name: 验证 Python 语法
        run: |
          python -m py_compile main.py
          python -m py_compile web_mixer.py
          python -m py_compile bsroformer/inference.py
          Write-Host "Syntax check passed!"
        shell: pwsh

      - name: 模拟导入测试
        run: |
          # 测试核心模块是否可导入（不包含 torch 依赖）
          python -c "
          import sys
          sys.path.insert(0, '.')

          # 测试 Flask 应用基础结构
          print('Testing imports...')
          import flask
          print('Flask: OK')

          import pydub
          print('PyDub: OK')

          import numpy
          print('NumPy: OK')

          print('All core imports successful!')
          "
        shell: pwsh

  # ==================== 发布准备 ====================
  release-check:
    name: 发布检查
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查版本号
        run: |
          # 从 main.py 提取版本号
          VERSION=$(grep -oP 'v\d+\.\d+\.\d+' main.py | head -1)
          echo "Current version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 生成变更日志摘要
        run: |
          echo "## 🚀 Release Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ All checks passed!" >> $GITHUB_STEP_SUMMARY

  # ==================== 通知 ====================
  notify:
    name: 状态通知
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
      - name: 生成构建报告
        run: |
          echo "## 🔔 CI/CD Pipeline 完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 任务 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 代码检查 | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 安全扫描 | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建验证 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
